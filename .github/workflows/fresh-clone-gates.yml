name: Fresh clone gates

# Proves any harness getting this ref (not only a dirty Cursor workspace).
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR / push ref
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ffmpeg (render QA)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Studies present on this ref
        run: |
          test -f skills/ad-intelligence/studies/corpus.json
          test -f pipeline/qa/prove-qa.mjs
          test -f regression/fail/oply-v1/expected.json
          test -f classroom/study-cards/_schema.json
          test -f specs/ad-spec.schema.json
          test -f library/scripts/demo-compose-plan.mjs
          node -e "const c=require('./skills/ad-intelligence/studies/corpus.json'); if(!c.studies?.length) process.exit(1); for (const s of c.studies){ if(typeof s.provenance?.observed!=='boolean') process.exit(2);} "

      - name: Demo quality gates (+ studies join + render QA)
        working-directory: skills/ad-intelligence
        run: node scripts/demo-quality-gates.mjs

      - name: Asset gate (audio + footage acquire path)
        run: |
          test -f library/assets/license-ledger.json
          test -f library/assets/TOOL-ROUTING.md
          test -f library/sound/beds/bed_wallpaper_km.mp3
          test -f library/sound/sfx/sfx_phone_ring.mp3
          test -d library/footage/home-services
          test -f library/scripts/acquire-assets.mjs
          node library/scripts/assert-assets.mjs --niche home-services
          # expect exit 0 when home-services stills seeded

      - name: Classroom + hub E2E (retrieve → spec → plan → v2 PASS)
        run: node pipeline/scripts/e2e-brief-to-plan.mjs --render

      - name: Backtest suite
        working-directory: skills/ad-intelligence
        run: node scripts/backtest.mjs

      - name: Fresh-checkout prove (retrieve provenance join)
        working-directory: skills/ad-intelligence
        run: node scripts/fresh-clone-prove.mjs
